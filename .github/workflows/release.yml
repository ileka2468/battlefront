name: Battlefront CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battlefront-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build React and Tailwind
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Verify Python, viewer and model assets
        run: |
          python -m compileall -q server web cloud start.py
          node --check web/tacview.js
          node scripts/verify_contact_spacing.cjs
          python scripts/verify_aircraft_assets.py
      - name: Validate campaign mission Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          find mission -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
          luac5.1 -p server/BattlefrontCampaignExport.lua
      - name: Test durable workspace and deployment edge
        run: python -m unittest discover -s tests -v
